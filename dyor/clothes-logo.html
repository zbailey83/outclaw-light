<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>D Y O R // Clothes Logo Interactive ASCII Engine</title>
  <style>
    /* ==========================================================================
       Reset & Midnight Dark Canvas Theme
       ========================================================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #04050a;
      font-family: 'Courier New', Courier, monospace;
      color: #e0e6ed;
      touch-action: none;
    }

    /* Background Ambient Tech Glow & Grid */
    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        radial-gradient(circle at 50% 40%, rgba(251, 191, 36, 0.1) 0%, rgba(56, 189, 248, 0.08) 45%, transparent 80%),
        linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 100% 100%, 25px 25px, 25px 25px;
      pointer-events: none;
      z-index: 1;
    }

    /* ==========================================================================
       Canvas & Hidden Ingestion Elements
       ========================================================================== */
    #asciiCanvas {
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 2;
      cursor: pointer;
      touch-action: none;
    }

    #logoSource {
      display: none;
    }

    /* ==========================================================================
       UI Overlay Controls & Status Badges (Mobile Responsive)
       ========================================================================== */
    .ui-overlay {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .brand-title {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 3px;
      color: #fbbf24;
      text-shadow: 0 0 12px rgba(251, 191, 36, 0.6);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-title::before {
      content: '';
      display: inline-block;
      width: 8px;
      height: 8px;
      background: #38bdf8;
      border-radius: 50%;
      box-shadow: 0 0 10px #38bdf8;
    }

    .state-badge {
      display: inline-flex;
      align-items: center;
      padding: 5px 12px;
      background: rgba(10, 14, 26, 0.88);
      border: 1px solid rgba(251, 191, 36, 0.35);
      border-radius: 20px;
      font-size: 11px;
      letter-spacing: 1.5px;
      color: #a0aec0;
      backdrop-filter: blur(8px);
      width: fit-content;
    }

    .state-badge span {
      color: #ffffff;
      font-weight: 700;
      margin-left: 6px;
    }

    .instruction-bar {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      background: rgba(10, 14, 26, 0.88);
      border: 1px solid rgba(56, 189, 248, 0.35);
      padding: 8px 18px;
      border-radius: 30px;
      font-size: 11px;
      letter-spacing: 1.5px;
      color: #8899ac;
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      pointer-events: auto;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 12px;
      white-space: nowrap;
    }

    .instruction-bar:hover, .instruction-bar:active {
      border-color: #fbbf24;
      color: #38bdf8;
      box-shadow: 0 0 25px rgba(251, 191, 36, 0.5);
    }

    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 2px;
      pointer-events: auto;
    }

    .btn {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #cbd5e1;
      padding: 5px 10px;
      border-radius: 6px;
      font-family: inherit;
      font-size: 10px;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn:hover, .btn:active {
      background: rgba(56, 189, 248, 0.2);
      border-color: #38bdf8;
      color: #ffffff;
    }

    .btn.active {
      background: rgba(251, 191, 36, 0.3);
      border-color: #fbbf24;
      color: #fbbf24;
      font-weight: bold;
    }

    @media (max-width: 600px) {
      .brand-title {
        font-size: 12px;
        letter-spacing: 2px;
      }
      .state-badge {
        font-size: 10px;
        padding: 4px 10px;
      }
      .instruction-bar {
        font-size: 10px;
        padding: 8px 14px;
        bottom: 16px;
      }
      .btn {
        padding: 4px 8px;
        font-size: 9px;
      }
    }
  </style>
</head>

  <!-- ==========================================================================
       Core Physics & ASCII Particle Engine
       ========================================================================== -->
  <script>
    /**
     * D Y O R Clothes Edition ASCII Particle Engine
     * ----------------------------------------------------
     * Features:
     * 1. Multi-Color Particle Shader (Amber Shirt, Cyan Shorts, White Tag/DYOR Text)
     * 2. Dynamic Mobile/Desktop Grid Scaling (48x48 on mobile, 72x72 on desktop)
     * 3. Full Touch & Mouse Repulsion Physics
     * 4. 4-State Physics Machine (Logo, Scatter, Gravity Bounce Floor, Return Home)
     */

    // --- Physics & Grid Constants ---
    let HOVER_RADIUS = 110;
    let PUSH_STRENGTH = 6.8;
    const GRAVITY = 0.44;
    const DEFAULT_BOUNCE = 0.23;
    const SPRING_EASE = 0.085;

    // ASCII Density Characters
    const ASCII_CHARS = "DYOR#*+=-:. ";

    // High Density Color Palettes for clothes logo layers
    const YELLOW_PALETTE = ["#fbbf24", "#f59e0b", "#fcd34d", "#feef8c", "#fbbf24"];
    const CYAN_PALETTE   = ["#38bdf8", "#00f3ff", "#0284c7", "#7dd3fc", "#00f3ff"];
    const WHITE_PALETTE  = ["#ffffff", "#f8fafc", "#e2e8f0", "#38bdf8", "#ffffff"];
    const DARK_PALETTE   = ["#94a3b8", "#64748b", "#38bdf8", "#475569", "#cbd5e1"];

    // Physics State Constants
    const STATES = {
      LOGO: 0,
      SCATTERED: 1,
      FALLEN: 2,
      RETURNING: 3
    };

    const STATE_NAMES = [
      "0: LOGO (TOUCH / HOVER)",
      "1: STAGGERED SCATTER",
      "2: GRAVITY & BOUNCE FLOOR",
      "3: SLIDING HOME"
    ];

    // --- Global Engine Variables ---
    let canvas, ctx;
    let particles = [];
    let currentState = STATES.LOGO;
    let dpr = 1;
    let mouse = { x: -9999, y: -9999, active: false };
    let touchMoved = false;

    // Offscreen Canvas Sampler
    let samplerCanvas = document.createElement('canvas');
    let samplerCtx = samplerCanvas.getContext('2d', { willReadFrequently: true });

    // Particle Blueprint Class
    class ASCIIParticle {
      constructor(homeX, homeY, char, colorType) {
        this.homeX = homeX;
        this.homeY = homeY;
        this.x = homeX + (Math.random() - 0.5) * 20;
        this.y = homeY + (Math.random() - 0.5) * 20;
        this.vx = 0;
        this.vy = 0;
        
        // Scatter Target Coordinates
        this.scatterX = 0;
        this.scatterY = 0;
        
        // Stagger & Physics Factors
        this.bounceFactor = DEFAULT_BOUNCE + (Math.random() - 0.5) * 0.04;
        this.staggerDelay = Math.random(); // Delay 0..1
        this.char = char;
        this.colorType = colorType; // 'yellow', 'cyan', 'white', 'dark'
        
        // Palette selection
        let palette;
        if (colorType === 'yellow') palette = YELLOW_PALETTE;
        else if (colorType === 'cyan') palette = CYAN_PALETTE;
        else if (colorType === 'white') palette = WHITE_PALETTE;
        else palette = DARK_PALETTE;

        this.baseColor = palette[Math.floor(Math.random() * palette.length)];
      }

      assignScatterTarget(w, h) {
        const margin = 110;
        this.scatterX = -margin + Math.random() * (w + margin * 2);
        this.scatterY = -margin + Math.random() * (h + margin * 2);
      }

      update(canvasWidth, canvasHeight) {
        switch (currentState) {
          
          // ==========================================
          // State 0: Resting Logo (Touch/Mouse Repulsion)
          // ==========================================
          case STATES.LOGO: {
            if (mouse.active) {
              const dx = this.x - mouse.x;
              const dy = this.y - mouse.y;
              const dist = Math.hypot(dx, dy);

              if (dist < HOVER_RADIUS && dist > 0) {
                const force = (HOVER_RADIUS - dist) / HOVER_RADIUS;
                const angle = Math.atan2(dy, dx);
                this.vx += Math.cos(angle) * force * PUSH_STRENGTH;
                this.vy += Math.sin(angle) * force * PUSH_STRENGTH;
              }
            }

            // Spring force back home
            const homeDx = this.homeX - this.x;
            const homeDy = this.homeY - this.y;
            this.vx += homeDx * SPRING_EASE;
            this.vy += homeDy * SPRING_EASE;

            // Damping
            this.vx *= 0.81;
            this.vy *= 0.81;

            this.x += this.vx;
            this.y += this.vy;
            break;
          }

          // ==========================================
          // State 1: Staggered Scatter
          // ==========================================
          case STATES.SCATTERED: {
            const dx = this.scatterX - this.x;
            const dy = this.scatterY - this.y;

            this.vx += dx * 0.045 * (0.5 + this.staggerDelay * 0.5);
            this.vy += dy * 0.045 * (0.5 + this.staggerDelay * 0.5);

            this.vx *= 0.85;
            this.vy *= 0.85;

            this.x += this.vx;
            this.y += this.vy;
            break;
          }

          // ==========================================
          // State 2: Gravity & Bouncing Floor
          // ==========================================
          case STATES.FALLEN: {
            this.vy += GRAVITY;
            this.vx *= 0.98; // Air friction

            this.x += this.vx;
            this.y += this.vy;

            // Floor Threshold
            const floorY = canvasHeight - 20;
            if (this.y >= floorY) {
              this.y = floorY;
              this.vy = -this.vy * this.bounceFactor;
              this.vx *= 0.75; // Ground friction

              if (Math.abs(this.vy) < 0.3) {
                this.vy = 0;
              }
            }
            break;
          }

          // ==========================================
          // State 3: Slide Back Home
          // ==========================================
          case STATES.RETURNING: {
            const dx = this.homeX - this.x;
            const dy = this.homeY - this.y;

            this.vx += dx * (0.075 + this.staggerDelay * 0.04);
            this.vy += dy * (0.075 + this.staggerDelay * 0.04);

            this.vx *= 0.81;
            this.vy *= 0.81;

            this.x += this.vx;
            this.y += this.vy;
            break;
          }
        }
      }

      draw(ctx, fontSize) {
        ctx.fillStyle = this.baseColor;
        ctx.fillText(this.char, this.x, this.y);
      }
    }

    // ==========================================================================
    // Initialization & Event Listeners
    // ==========================================================================
    function initCanvas() {
      canvas = document.getElementById('asciiCanvas');
      ctx = canvas.getContext('2d');

      resizeCanvas();

      window.addEventListener('resize', () => {
        resizeCanvas();
        const img = document.getElementById('logoSource');
        if (img.complete && img.naturalWidth !== 0) {
          sampleLogoAndBuildParticles(img);
        }
      });

      // --- Mouse Events ---
      canvas.addEventListener('mousemove', (e) => {
        const rect = canvas.getBoundingClientRect();
        mouse.x = e.clientX - rect.left;
        mouse.y = e.clientY - rect.top;
        mouse.active = true;
      });

      canvas.addEventListener('mouseleave', () => {
        mouse.active = false;
      });

      canvas.addEventListener('click', (e) => {
        if (!touchMoved) {
          cyclePhysicsState();
        }
        touchMoved = false;
      });

      // --- Touch Events ---
      canvas.addEventListener('touchstart', (e) => {
        touchMoved = false;
        if (e.touches.length > 0) {
          const rect = canvas.getBoundingClientRect();
          mouse.x = e.touches[0].clientX - rect.left;
          mouse.y = e.touches[0].clientY - rect.top;
          mouse.active = true;
        }
      }, { passive: true });

      canvas.addEventListener('touchmove', (e) => {
        touchMoved = true;
        if (e.touches.length > 0) {
          const rect = canvas.getBoundingClientRect();
          mouse.x = e.touches[0].clientX - rect.left;
          mouse.y = e.touches[0].clientY - rect.top;
          mouse.active = true;
        }
      }, { passive: true });

      canvas.addEventListener('touchend', (e) => {
        mouse.active = false;
        if (!touchMoved) {
          cyclePhysicsState();
        }
      });

      const img = document.getElementById('logoSource');
      if (img.complete && img.naturalWidth !== 0) {
        sampleLogoAndBuildParticles(img);
      } else {
        img.onload = () => sampleLogoAndBuildParticles(img);
      }

      requestAnimationFrame(animationLoop);
    }

    function resizeCanvas() {
      dpr = Math.max(1, window.devicePixelRatio || 1);
      const w = window.innerWidth;
      const h = window.innerHeight;

      canvas.width = w * dpr;
      canvas.height = h * dpr;
      canvas.style.width = w + 'px';
      canvas.style.height = h + 'px';

      ctx.scale(dpr, dpr);
    }

    function sampleLogoAndBuildParticles(imgElement) {
      const vW = window.innerWidth;
      const vH = window.innerHeight;

      const isMobile = vW < 768;
      const sampleCols = isMobile ? 52 : 72;
      const sampleRows = isMobile ? 54 : 76;

      HOVER_RADIUS = isMobile ? 90 : 115;
      PUSH_STRENGTH = isMobile ? 7.5 : 7.0;

      samplerCanvas.width = sampleCols;
      samplerCanvas.height = sampleRows;

      samplerCtx.clearRect(0, 0, sampleCols, sampleRows);
      samplerCtx.drawImage(imgElement, 0, 0, sampleCols, sampleRows);

      const imgData = samplerCtx.getImageData(0, 0, sampleCols, sampleRows);
      const pixels = imgData.data;

      particles = [];

      const maxLogoW = Math.min(vW * 0.85, 520);
      const maxLogoH = Math.min(vH * 0.75, 580);

      const charSpacingX = maxLogoW / sampleCols;
      const charSpacingY = maxLogoH / sampleRows;

      const totalLogoW = sampleCols * charSpacingX;
      const totalLogoH = sampleRows * charSpacingY;

      const originX = (vW - totalLogoW) / 2;
      const originY = (vH - totalLogoH) / 2;

      for (let y = 0; y < sampleRows; y++) {
        for (let x = 0; x < sampleCols; x++) {
          const idx = (y * sampleCols + x) * 4;
          const r = pixels[idx];
          const g = pixels[idx + 1];
          const b = pixels[idx + 2];

          const brightness = (r + g + b) / 3;

          // Non-black pixels threshold
          if (brightness > 25) {
            const homeX = originX + x * charSpacingX;
            const homeY = originY + y * charSpacingY;

            // Classify pixel color type
            let colorType = 'dark';
            if (r > 180 && g > 150 && b < 130) {
              colorType = 'yellow';
            } else if (b > 140 && r < 140) {
              colorType = 'cyan';
            } else if (brightness > 180) {
              colorType = 'white';
            }

            const charIdx = Math.floor((brightness / 255) * (ASCII_CHARS.length - 1));
            const char = ASCII_CHARS[charIdx] || 'D';

            const particle = new ASCIIParticle(homeX, homeY, char, colorType);
            particle.assignScatterTarget(vW, vH);
            particles.push(particle);
          }
        }
      }
    }

    // ==========================================================================
    // State Manager & Controls
    // ==========================================================================
    function cyclePhysicsState() {
      setPhysicsState((currentState + 1) % 4);
    }

    function setPhysicsState(newState) {
      currentState = newState;
      
      document.getElementById('stateLabel').innerText = STATE_NAMES[currentState];
      
      const buttons = document.querySelectorAll('.btn');
      buttons.forEach((btn, idx) => {
        if (idx === currentState) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });

      const vW = window.innerWidth;
      const vH = window.innerHeight;

      if (currentState === STATES.SCATTERED) {
        particles.forEach(p => p.assignScatterTarget(vW, vH));
      }
    }

    // ==========================================================================
    // Render & Animation Loop
    // ==========================================================================
    function animationLoop() {
      const vW = window.innerWidth;
      const vH = window.innerHeight;

      // Midnight Dark Canvas Background
      ctx.fillStyle = '#04050a';
      ctx.fillRect(0, 0, vW, vH);

      const fontSize = vW < 768 ? 9 : 8.5;
      ctx.font = `bold ${fontSize}px "Courier New", monospace`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      let allReturned = true;

      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        p.update(vW, vH);
        p.draw(ctx, fontSize);

        if (currentState === STATES.RETURNING) {
          const dist = Math.hypot(p.x - p.homeX, p.y - p.homeY);
          if (dist > 0.5) {
            allReturned = false;
          }
        }
      }

      if (currentState === STATES.RETURNING && allReturned && particles.length > 0) {
        setPhysicsState(STATES.LOGO);
      }

      requestAnimationFrame(animationLoop);
    }

    window.addEventListener('DOMContentLoaded', initCanvas);
  </script>
</body>
</html>
